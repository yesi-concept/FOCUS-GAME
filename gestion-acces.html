<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Gestion des accès — Y.E.S.I CONCEPT</title>
<style>
body[data-theme="dark"]{
  --bg:#000000; --bg2:#0a0a0a; --card:#0d0d0d; --card2:#141414;
  --gold:#c9a04e; --gold-soft:#e3c27f; --ink:#f2ead9; --ink-dim:#a99a7c;
  --border:#262626; --danger:#c65f52; --success:#6f9a68;
  --shadow: 0 10px 30px rgba(0,0,0,.6);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:40px;}
h1,h2{font-family:Georgia,"Iowan Old Style","Palatino Linotype",serif; font-weight:600; margin:0;}
header.top{position:sticky; top:0; z-index:20; background:linear-gradient(180deg,var(--bg2),var(--bg)); border-bottom:1px solid var(--border); padding:16px 18px 12px;}
.brand{display:flex; justify-content:space-between; align-items:center; gap:10px;}
.brand-left{display:flex; align-items:center; gap:11px;}
.brand-left img{width:38px; height:38px; object-fit:contain; flex-shrink:0;}
.brand h1{font-size:19px; letter-spacing:.3px; color:var(--gold-soft);}
.brand small{display:block; font-size:11px; color:var(--ink-dim); margin-top:2px; letter-spacing:.4px;}
.icon-btn{background:var(--card2); border:1px solid var(--border); color:var(--ink); width:38px; height:38px; border-radius:50%; font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
.wrap{padding:16px; max-width:640px; margin:0 auto;}
.card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow);}
.card h2{font-size:15px; color:var(--gold-soft); margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px;}
label{display:block; font-size:12px; color:var(--ink-dim); margin:10px 0 4px;}
input[type=email], input[type=text]{
  width:100%; background:var(--card2); border:1px solid var(--border); color:var(--ink);
  border-radius:7px; padding:11px 12px; font-size:15px; font-family:inherit;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border);
  background:var(--card2); color:var(--ink); padding:11px 16px; border-radius:8px; font-size:14.5px; cursor:pointer;}
.btn-gold{background:var(--gold); color:#1c1710; border:none; font-weight:600;}
.btn-block{width:100%; margin-top:12px;}
.member{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 0; border-bottom:1px solid var(--border);}
.member:last-child{border-bottom:none;}
.member-info{min-width:0;}
.member-name{font-size:14.5px; font-weight:600; color:var(--ink);}
.member-email{font-size:12.5px; color:var(--ink-dim); word-break:break-all;}
.member-date{font-size:11px; color:var(--ink-dim); margin-top:2px;}
.rm-btn{background:none; border:1px solid var(--danger); color:var(--danger); width:36px; height:36px; border-radius:8px; font-size:15px; cursor:pointer; flex-shrink:0;}
.muted{color:var(--ink-dim); font-size:13px;}
.empty-state{text-align:center; padding:30px 10px; color:var(--ink-dim); font-size:13.5px;}
.count-badge{display:inline-block; background:var(--card2); border:1px solid var(--border); color:var(--gold-soft); font-size:12px; padding:2px 10px; border-radius:20px; margin-left:8px;}
.form-msg{font-size:12.5px; margin-top:8px;}
.form-msg.err{color:var(--danger);}
.form-msg.ok{color:var(--success);}

/* Ecran de connexion */
.auth-gate{position:fixed; inset:0; z-index:100; background:#000; display:flex; align-items:center; justify-content:center; padding:24px;}
.auth-card{width:100%; max-width:360px; text-align:center; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:32px 24px; box-shadow:var(--shadow);}
.auth-logo{width:56px; height:56px; object-fit:contain; margin-bottom:14px;}
.auth-card h1{font-size:19px; color:var(--gold-soft); margin-bottom:2px;}
.auth-sub{font-size:11px; color:var(--ink-dim); letter-spacing:1px; text-transform:uppercase; margin-bottom:22px;}
.auth-text{font-size:13.5px; color:var(--ink-dim); line-height:1.6; margin-bottom:18px;}
.auth-error{font-size:12.5px; color:var(--danger); margin-top:12px;}
#googleSignInBtn{display:flex; align-items:center; justify-content:center; gap:10px;}
</style>
</head>
<body data-theme="dark">

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <img src="" id="authLogo" alt="Y.E.S.I CONCEPT" class="auth-logo">
    <h1>Gestion des accès</h1>
    <p class="auth-sub">Y.E.S.I CONCEPT — Espace admin</p>

    <div id="authStep-loading">
      <p class="auth-text">Chargement…</p>
    </div>

    <div id="authStep-login" style="display:none;">
      <p class="auth-text">Connecte-toi avec ton compte Google Y.E.S.I CONCEPT.</p>
      <button id="googleSignInBtn" class="btn btn-gold btn-block">Se connecter avec Google</button>
      <p id="authError" class="auth-error" style="display:none;"></p>
    </div>

    <div id="authStep-denied" style="display:none;">
      <p class="auth-text">Cet espace est réservé à l'administrateur Y.E.S.I CONCEPT.</p>
      <button id="signOutBtn" class="btn btn-outline btn-block">Se déconnecter</button>
    </div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<header class="top">
  <div class="brand">
    <div class="brand-left">
      <img src="" id="brandLogo" alt="Logo Y.E.S.I CONCEPT">
      <div>
        <h1>Gestion des accès</h1>
        <small>Y.E.S.I CONCEPT — liste blanche</small>
      </div>
    </div>
    <button class="icon-btn" id="appSignOutBtn" title="Se déconnecter">🚪</button>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2>Ajouter un accès</h2>
    <label>Email Google du bénéficiaire</label>
    <input type="email" id="newEmail" placeholder="prenom.nom@gmail.com" autocomplete="off" autocapitalize="off">
    <label>Nom (optionnel, pour t'y retrouver)</label>
    <input type="text" id="newName" placeholder="Ex : Kais Lfareh">
    <button class="btn btn-gold btn-block" id="addAccessBtn">Autoriser cet accès</button>
    <p id="formMsg" class="form-msg" style="display:none;"></p>
  </div>

  <div class="card">
    <h2>Accès autorisés<span class="count-badge" id="countBadge">0</span></h2>
    <div id="membersList"></div>
  </div>
</div>
</div><!-- /appRoot -->

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js" crossorigin="anonymous"></script>

const OWNER_EMAIL = "yesiconcept.rdv@gmail.com";

const firebaseConfig = {
  apiKey: "AIzaSyA1NE8TIoR3NafqF39SSOZ3nlJGpXgJ95A",
  authDomain: "suivi-joueur.firebaseapp.com",
  projectId: "suivi-joueur",
  storageBucket: "suivi-joueur.firebasestorage.app",
  messagingSenderId: "2190589503",
  appId: "1:2190589503:web:e6df856ce4577d1e41828a"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

window.addEventListener("error", (ev)=>{
  const el = document.getElementById("authError");
  if(!el) return;
  showAuthStep("login");
  el.textContent = "Erreur technique : " + (ev.message || "voir détails");
  el.style.display = "block";
});

function showAuthStep(step){
  document.getElementById("authStep-loading").style.display = step==="loading" ? "block" : "none";
  document.getElementById("authStep-login").style.display = step==="login" ? "block" : "none";
  document.getElementById("authStep-denied").style.display = step==="denied" ? "block" : "none";
}

document.getElementById("googleSignInBtn").addEventListener("click", ()=>{
  document.getElementById("authError").style.display = "none";
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err=>{
    const el = document.getElementById("authError");
    el.textContent = "Connexion impossible : " + (err.code || err.message || "erreur inconnue");
    el.style.display = "block";
  });
});
document.getElementById("signOutBtn").addEventListener("click", ()=>{ auth.signOut(); });
document.getElementById("appSignOutBtn").addEventListener("click", ()=>{ auth.signOut(); });

let unsubscribeList = null;

auth.onAuthStateChanged((user)=>{
  if(!user){
    if(unsubscribeList){ unsubscribeList(); unsubscribeList = null; }
    document.getElementById("appRoot").style.display = "none";
    document.getElementById("authGate").style.display = "flex";
    showAuthStep("login");
    return;
  }
  const email = (user.email || "").toLowerCase();
  if(email !== OWNER_EMAIL){
    showAuthStep("denied");
    return;
  }
  document.getElementById("authGate").style.display = "none";
  document.getElementById("appRoot").style.display = "block";
  startListening();
});

function startListening(){
  if(unsubscribeList) return;
  unsubscribeList = db.collection("whitelist").onSnapshot((snap)=>{
    const members = [];
    snap.forEach(doc=>{
      const d = doc.data();
      members.push({
        email: doc.id,
        nom: d.nom || "",
        ajouteLe: d.ajouteLe && d.ajouteLe.toDate ? d.ajouteLe.toDate() : null
      });
    });
    members.sort((a,b)=> (a.nom||a.email).localeCompare(b.nom||b.email));
    renderMembers(members);
  }, (err)=>{
    document.getElementById("membersList").innerHTML =
      `<p class="muted">Lecture impossible : ${err.code || err.message}</p>`;
  });
}

function renderMembers(members){
  document.getElementById("countBadge").textContent = members.length;
  const el = document.getElementById("membersList");
  if(!members.length){
    el.innerHTML = `<div class="empty-state">Aucun accès autorisé pour le moment.<br>Ajoute le premier ci-dessus.</div>`;
    return;
  }
  el.innerHTML = members.map(m=>{
    const dateStr = m.ajouteLe ? m.ajouteLe.toLocaleDateString("fr-FR") : "";
    return `<div class="member">
      <div class="member-info">
        <div class="member-name">${m.nom || m.email}</div>
        ${m.nom ? `<div class="member-email">${m.email}</div>` : ``}
        ${dateStr ? `<div class="member-date">Ajouté le ${dateStr}</div>` : ``}
      </div>
      <button class="rm-btn" onclick="removeAccess('${m.email.replace(/'/g,"\\'")}')" title="Retirer l'accès">✕</button>
    </div>`;
  }).join("");
}

function isValidEmail(v){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

document.getElementById("addAccessBtn").addEventListener("click", async ()=>{
  const msgEl = document.getElementById("formMsg");
  const emailInput = document.getElementById("newEmail");
  const nameInput = document.getElementById("newName");
  const email = emailInput.value.trim().toLowerCase();
  const nom = nameInput.value.trim();

  msgEl.style.display = "none";
  if(!isValidEmail(email)){
    msgEl.textContent = "Adresse email invalide.";
    msgEl.className = "form-msg err";
    msgEl.style.display = "block";
    return;
  }

  const btn = document.getElementById("addAccessBtn");
  btn.disabled = true; btn.textContent = "Ajout en cours…";
  try{
    await db.collection("whitelist").doc(email).set({
      nom: nom || "",
      actif: true,
      ajouteLe: firebase.firestore.FieldValue.serverTimestamp()
    });
    emailInput.value = ""; nameInput.value = "";
    msgEl.textContent = "Accès autorisé pour " + email;
    msgEl.className = "form-msg ok";
    msgEl.style.display = "block";
  }catch(err){
    msgEl.textContent = "Échec : " + (err.code || err.message);
    msgEl.className = "form-msg err";
    msgEl.style.display = "block";
  }finally{
    btn.disabled = false; btn.textContent = "Autoriser cet accès";
  }
});

window.removeAccess = async function(email){
  if(!confirm("Retirer l'accès de " + email + " ?")) return;
  try{
    await db.collection("whitelist").doc(email).delete();
  }catch(err){
    alert("Échec de la suppression : " + (err.code || err.message));
  }
};
</script>
</body>
</html>
