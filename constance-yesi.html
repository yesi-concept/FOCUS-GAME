<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon niveau de constance — Y.E.S.I CONCEPT</title>
<style>
:root{--navy:#011228;--blue:#1f6fd6;--tint:#e6effb;--ink:#101a2b;--quiet:#55617a;--line:#d5dbe6;--grey:#c3cad6;--soft:#f3f5f9;--red:#c8423b;--redt:#fbeceb;--amber:#c98a14;--ambert:#fbf3e2}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--ink);font:16px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header{background:var(--navy);color:#fff;text-align:center;padding:10px 16px 20px}
header img{display:block;height:150px;width:auto;margin:0 auto}
h1{font:700 27px/1.15 Georgia,"Times New Roman",serif;margin:4px 0 4px}
header p{margin:0;color:#a9c6f0;font-size:15px}
.prog{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:9px 16px}
.prog div.t{font-size:13px;color:var(--quiet);display:flex;justify-content:space-between;gap:12px}
.prog .b{height:5px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
.prog .b i{display:block;height:100%;background:var(--blue);transition:width .2s}
main{max-width:720px;margin:0 auto;padding:16px 16px 24px}
h2{font:700 23px/1.2 Georgia,"Times New Roman",serif;color:var(--navy);margin:4px 0 8px}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 12px}
.q{color:var(--quiet);font-size:14.5px}
.box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
label.f{display:block;font-weight:600;font-size:14.5px;margin-bottom:12px}
label.f:last-child{margin-bottom:0}
input[type=text],input[type=date],select,textarea{display:block;width:100%;margin-top:5px;font:400 16px/1.4 inherit;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--grey);border-radius:8px;padding:10px 11px}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:var(--blue)}
.fam{font:700 18px/1.2 Georgia,"Times New Roman",serif;color:var(--navy);margin:18px 0 8px}
.item{padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.item b{display:block;font-size:15.5px;line-height:1.3}
.item small{display:block;color:var(--quiet);font-size:13.5px;line-height:1.35;margin-bottom:7px}
.chips{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.chips.c6{grid-template-columns:repeat(6,1fr)}
.chips.c3{grid-template-columns:repeat(3,1fr)}
.chips.c2{grid-template-columns:repeat(2,1fr)}
.chip{appearance:none;font:600 15px/1 inherit;font-family:inherit;color:var(--ink);background:#fff;border:1px solid var(--grey);border-radius:7px;min-height:42px;padding:0 2px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12.5px;line-height:1.25;text-align:center}
.scale div{background:var(--soft);border-radius:7px;padding:7px 3px}
.scale b{display:block;font-size:14px}
.ask{margin-top:12px}
.ask:first-of-type{margin-top:0}
.ask>span{display:block;font-size:14.5px;font-weight:500;margin-bottom:6px}
.nav{display:flex;gap:10px;margin-top:16px}
.btn{appearance:none;flex:1;font:700 16px/1.2 inherit;font-family:inherit;min-height:50px;border-radius:9px;border:1px solid var(--navy);background:var(--navy);color:#fff;padding:0 12px;cursor:pointer}
.btn.sec{background:#fff;color:var(--navy);flex:.6}
.err{color:var(--red);font-size:14.5px;font-weight:600;margin:12px 0 0}
.seg{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:12px}
.bloc{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;break-inside:avoid}
.bh{color:#fff;padding:10px 13px 11px}
.bh small{display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.92}
.bh b{display:block;font:700 22px/1.15 Georgia,"Times New Roman",serif;margin-top:1px}
.bh span{display:block;font-size:14px;line-height:1.3;margin-top:2px}
.haute .bh{background:var(--blue)}.nonex .bh{background:#4b8fe0}.acquis .bh{background:var(--quiet)}.autre .bh{background:var(--red)}
.bloc ul{list-style:none;margin:0;padding:3px 13px 5px}
.bloc li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.3}
.bloc li:first-child{border-top:0}
.bloc li em{font-style:normal;font-weight:700;white-space:nowrap}
.bloc .none{display:block;padding:9px 13px 11px}
.none{color:var(--quiet);font-size:14px}
.pf h4{margin:12px 0 6px;font-size:14px;color:var(--quiet)}
.pf h4:first-child{margin-top:0}
.pr{display:grid;grid-template-columns:112px 1fr 30px;align-items:center;gap:7px;font-size:13.5px;line-height:1.2;margin-bottom:5px}
.pr em{font-style:normal;text-align:right;font-weight:600}
.tk{position:relative;height:15px;background:var(--soft);border-radius:3px}
.tk i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--grey)}
.tk::after{content:"";position:absolute;left:70%;top:-2px;bottom:-2px;border-left:1.5px dashed var(--quiet)}
.pr.haute i{background:var(--blue)} .pr.nonex i{background:#7fb0ea} .pr.autre i{background:var(--red)}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--quiet);margin-top:10px}
.leg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;background:var(--c)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp div{background:var(--soft);border-radius:8px;padding:9px 10px;font-size:13px;color:var(--quiet)}
.cmp b{display:block;color:var(--ink);font-size:15.5px;margin-top:2px}
.msg{font-size:14.5px;margin:10px 0 0}
details summary{cursor:pointer;font-weight:600;font-size:15px}
.ov{display:grid;grid-template-columns:1fr 1.15fr;gap:8px;align-items:center;font-size:14px;margin-top:8px}
.ov select{margin:0;padding:8px;font-size:14.5px}
.acts{display:grid;gap:8px}
.acts .btn{flex:none;width:100%}
.acts .btn.sec{background:#fff;color:var(--navy)}
footer{text-align:center;color:var(--quiet);font-size:13px;padding:0 16px 24px}
@media (min-width:640px){.seg{grid-template-columns:1fr 1fr}.chip{font-size:16px}header img{height:180px}}
.printonly{display:none}
@page{size:A4;margin:10mm 12mm}
@media print{
 body{background:#fff;font-size:10.5pt}
 header,.prog,.nav,.noprint,footer{display:none!important}
 .printonly{display:block}
 main{max-width:none;padding:0}
 .ph{display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;border-radius:8px;padding:5px 14px;margin-bottom:10px}
 .ph img{height:24mm}
 .ph h1{font-size:20pt;margin:0}
 .ph p{margin:0;color:#a9c6f0;font-size:10pt}
 .box{padding:9px 11px;margin-bottom:8px;break-inside:avoid}
 .seg{grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}
 
 .bh{padding:6px 10px 7px}.bh b{font-size:15pt}.bh span{font-size:9.5pt}.bh small{font-size:8.5pt}
 .bloc ul{padding:2px 10px 3px}.bloc li{padding:3px 0;font-size:10pt}
 h2{font-size:15pt}
 .pf{column-count:2;column-gap:8mm}
 .pf h4{break-after:avoid;margin-top:6px}
 .pr{break-inside:avoid;grid-template-columns:27mm 1fr 8mm;margin-bottom:3px;font-size:9pt}
}
.chips.c4{grid-template-columns:repeat(4,1fr)}.chips.c5{grid-template-columns:repeat(5,1fr)}
.chips.c4 .chip,.chips.c3 .chip,.chips.c2 .chip{font-size:14px}
.multi .chip{min-height:46px;line-height:1.2;padding:4px 6px}
.verdict{border-radius:10px;padding:14px;color:#fff;margin-bottom:12px;background:var(--blue)}
.verdict.irregulier{background:#4b8fe0}.verdict.ponctuel{background:var(--quiet)}
.verdict small{display:block;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;opacity:.92}
.verdict b{display:block;font:700 24px/1.15 Georgia,"Times New Roman",serif;margin:2px 0 4px}
.verdict span{display:block;font-size:14.5px;line-height:1.4}
.duo{display:grid;grid-template-columns:1fr;gap:0}
.big{font:700 34px/1 Georgia,"Times New Roman",serif;margin:8px 0 2px;color:var(--navy)}.big em{font-style:normal;font-size:18px;color:var(--quiet)}
.lvl{display:inline-block;font-size:13px;font-weight:700;border-radius:20px;padding:2px 10px;margin:0 0 10px;color:#fff;background:var(--quiet)}
.lvl.constant,.lvl.solides{background:var(--blue)}.lvl.irregulier,.lvl.fragiles{background:var(--amber)}.lvl.ponctuel,.lvl.absentes{background:var(--red)}
.mdots{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:300px;text-align:center;font-size:11.5px;color:var(--quiet)}
.mdots i{display:block;width:34px;height:34px;margin:0 auto 3px;border-radius:50%;border:1.5px solid var(--line)}
.mdots i.oui{background:var(--blue);border-color:var(--blue)}.mdots i.partiel{background:linear-gradient(90deg,var(--blue) 50%,#fff 50%);border-color:var(--blue)}
.sm{font-size:13px;margin:10px 0 0}
.hl{display:grid;gap:6px}
.hr{display:grid;grid-template-columns:1fr 70px 62px;gap:8px;align-items:center;font-size:13.5px;line-height:1.2}
.hr em{font-style:normal;font-weight:600;font-size:12.5px;text-align:right}
.hr .tk::after{display:none}.hr .tk i{background:var(--blue)}.hr.low .tk i{background:var(--red)}.hr.low em{color:var(--red)}
.pl{white-space:pre-wrap;margin:6px 0 0}
.hide{display:none!important}
.tag{display:inline-block;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin:0 4px 4px 0;font-size:14px}
@media (min-width:640px){.duo{grid-template-columns:1fr 1fr;gap:12px}}
@media print{.duo{grid-template-columns:1fr 1fr;gap:8px}.verdict{padding:9px 12px;margin-bottom:8px}.verdict b{font-size:16pt}.big{font-size:22pt;margin-top:4px}.hr{font-size:9pt}.mdots i{width:24px;height:24px}.sm{font-size:8.5pt}}
</style></head><body>

<script>
const EMBED=/*DATA*/null/*END*/;
const KEY="yesi-constance-v1";
const LOGO=document.querySelector("header img").src;
const HAB=[["sommeil","Sommeil la veille du match","Tu dors à la même heure et autant avant chaque match"],["repas","Repas d'avant-match","Tu manges la même chose, au même moment"],["echauf","Échauffement","Tu fais le même échauffement, avec la même intensité"],["mental","Préparation mentale","Tu te remets en tête ta qualité et tes objectifs avant le match"],["entrain","Exigence à l'entraînement","Tu travailles ta qualité à l'entraînement avec la même intensité qu'en match"],["objectifs","Objectifs de moyens","Tu te fixes des actions concrètes à réaliser à chaque match"],["bilan","Bilan après match","Tu notes après chaque match si ta qualité s'est vue, et pourquoi"]];

const CAUSES=[["sommeil","Sommeil"],["fatigue","Fatigue"],["stress","Stress ou pression"],["motivation","Envie ou motivation"],["temps","Temps de jeu ou poste"],["adversaire","Adversaire"],["consignes","Consignes du coach"],["erreur","Une erreur qui m'a fait sortir du match"]];
const LABELS=["Identité","Mes 5 derniers matchs","Mes habitudes","Les matchs sans","Mon engagement","Résultat"];
const blank=()=>({step:0,id:{nom:"",poste:"",categorie:"",club:"",date:new Date().toISOString().slice(0,10),qualite:"",note:""},matchs:[0,1,2,3,4].map(()=>({adv:"",v:""})),hab:{},causes:{},autre:"",plan:{garder:"",installer:"",cible:"",prochain:""},comment:""});
function load(){if(EMBED)return EMBED;try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r));}catch(e){}return blank();}
let S=load(),error="";
function save(){if(EMBED)return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const Q=()=>S.id.qualite.trim()||"ta qualité haute";
function chips(path,vals,cur,cls,labels){return `<div class="chips ${cls||""}" role="group">`+vals.map((v,i)=>`<button type="button" class="chip" data-p="${path}" data-v="${v}" aria-pressed="${cur===v||String(cur)===String(v)}">${labels?labels[i]:v}</button>`).join("")+"</div>";}
function inp(p,l,v,t,ph){return `<label class="f">${l}<input type="${t||"text"}" data-i="${p}" value="${esc(v)}" ${ph?`placeholder="${esc(ph)}"`:""}></label>`;}
function area(p,l,v,ph){return `<label class="f">${l}<textarea data-i="${p}" placeholder="${esc(ph||"")}">${esc(v)}</textarea></label>`;}
function nav(next){return (error?`<p class="err">${esc(error)}</p>`:"")+`<div class="nav">${S.step>0?`<button class="btn sec" data-a="back">Retour</button>`:""}<button class="btn" data-a="next">${next||"Continuer"}</button></div>`;}
/* calculs */
const pts=v=>v==="oui"?1:v==="partiel"?0.5:0;
const vis=()=>S.matchs.reduce((s,m)=>s+pts(m.v),0);
function visLevel(){const v=vis();if(v>=4)return{k:"constant",n:"Constant",g:"Qualité haute visible en match (9-10)",t:"Ta qualité se voit match après match."};if(v>=2.5)return{k:"irregulier",n:"Irrégulier",g:"Qualité haute non exploitée (8)",t:"Ta qualité existe, mais elle ne se voit pas à chaque match."};return{k:"ponctuel",n:"Ponctuel",g:"Pas encore une qualité haute",t:"Pour l'instant, ta qualité se voit comme un exploit."};}
const habScore=()=>HAB.reduce((s,h)=>s+(+S.hab[h[0]]||0),0);
const habMax=HAB.length*3;
function habLevel(){const p=habScore()/habMax;if(p>=.75)return{k:"solides",n:"Solides"};if(p>=.5)return{k:"fragiles",n:"Fragiles"};return{k:"absentes",n:"À construire"};}
function verdict(){const v=visLevel().k,h=habLevel().k;
 if(v==="constant"&&h==="solides")return["Constance installée","Tes résultats et tes habitudes vont dans le même sens. L'objectif est de maintenir ce niveau."];
 if(v==="constant")return["Constance à sécuriser","Ta qualité se voit, mais tes habitudes ne sont pas encore solides. Au premier passage difficile, la constance peut tomber."];
 if(h==="solides")return["Constance à débloquer","Tes habitudes sont là, mais ta qualité ne se voit pas à chaque match. Il faut chercher ce qui change les jours sans."];
 return["Constance à construire","Tes habitudes ne sont pas encore régulières. C'est par elles qu'on commence : la constance en match viendra après."];}
const sansCount=()=>S.matchs.filter(m=>m.v&&m.v!=="oui").length;
/* étapes */
function s0(){const i=S.id;return `<h2>Le bénéficiaire</h2><p class="q">À remplir ensemble, après la lecture du document « Visible match après match ».</p><div class="box">${inp("id.nom","Nom et prénom",i.nom)}${inp("id.poste","Poste",i.poste,"text","Ex. ailier droit")}${inp("id.categorie","Catégorie",i.categorie,"text","Ex. U17 National")}${inp("id.club","Club",i.club)}${inp("id.date","Date",i.date,"date")}</div><div class="box">${inp("id.qualite","Qualité haute travaillée",i.qualite,"text","Ex. vitesse")}<div class="ask"><span>Sa note dans la segmentation des acquis (facultatif)</span>${chips("id.note",[7,8,9,10],i.note,"c4")}</div></div>`+nav();}
function s1(){return `<h2>Tes 5 derniers matchs</h2><p class="q">Pour chaque match, ta qualité (${esc(Q())}) s'est-elle vue ? Commence par le plus récent.</p>`+S.matchs.map((m,i)=>`<div class="box"><h3>Match ${i+1}${i===0?" (le plus récent)":""}</h3>${inp("matchs."+i+".adv","Adversaire (facultatif)",m.adv)}<div class="ask"><span>Ta qualité s'est-elle vue ?</span>${chips("matchs."+i+".v",["oui","partiel","non"],m.v,"c3",["Oui","En partie","Non"])}</div></div>`).join("")+nav();}
function s2(){return `<h2>Tes habitudes</h2><p class="q">La constance se construit avant le match. Que fais-tu de la même façon à chaque fois ?</p><div class="box">`+HAB.map(h=>`<div class="item"><b>${h[1]}</b><small>${h[2]}</small>${chips("hab."+h[0],FREQ.map(f=>f[0]),S.hab[h[0]],"c4",FREQ.map(f=>f[1]))}</div>`).join("")+"</div>"+nav();}
function s3(){const n=sansCount();if(!n)return `<h2>Les matchs sans</h2><div class="box"><p style="margin:0">Ta qualité s'est vue sur les 5 matchs : pas de match sans à analyser.</p></div>`+nav();
 return `<h2>Les matchs sans</h2><p class="q">Sur ${n} match${n>1?"s":""}, ta qualité ne s'est pas vue complètement. Qu'est-ce qui avait changé ? Plusieurs réponses possibles.</p><div class="box"><div class="chips c2 multi">`+CAUSES.map(c=>`<button type="button" class="chip" data-m="${c[0]}" aria-pressed="${!!S.causes[c[0]]}">${c[1]}</button>`).join("")+`</div><div style="margin-top:12px">${area("autre","Autre chose, ou précise",S.autre,"Ce qui était différent ces jours-là")}</div></div>`+nav();}
function s4(){return `<h2>Ton engagement</h2><div class="box">${area("plan.garder","Quelle habitude gardes-tu, parce qu'elle marche ?",S.plan.garder,"Une habitude")}${area("plan.installer","Quelle habitude installes-tu dès cette semaine ?",S.plan.installer,"Une seule, concrète")}<div class="ask"><span>Sur tes 5 prochains matchs, dans combien ta qualité doit-elle se voir ?</span>${chips("plan.cible",[1,2,3,4,5],S.plan.cible,"c5")}</div><div style="margin-top:12px">${inp("plan.prochain","Date du prochain bilan",S.plan.prochain,"date")}</div></div>`+nav("Voir le résultat");}
function dots(){return `<div class="mdots">`+S.matchs.map((m,i)=>`<div><i class="${m.v}"></i><span>M${i+1}</span></div>`).join("")+"</div>";}
function s5(){const i=S.id,vl=visLevel(),hl=habLevel(),[vt,vx]=verdict(),meta=[i.poste,i.categorie,i.club].filter(Boolean).map(esc).join(" · "),d=i.date?i.date.split("-").reverse().join("/"):"";
 const cs=CAUSES.filter(c=>S.causes[c[0]]).map(c=>c[1]);if(S.autre.trim())cs.push(S.autre.trim());
 const fd=v=>v?v.split("-").reverse().join("/"):"";
 return `<div class="printonly ph"><img src="${LOGO}" alt="Logo Y.E.S.I CONCEPT"><div><h1>Mon niveau de constance</h1><p>Y.E.S.I CONCEPT</p></div></div>
 <h2>${esc(i.nom)||"Résultat"}</h2><p class="q">${meta}${meta&&d?" · ":""}${d}</p>
 <div class="verdict ${vl.k}"><small>Niveau de constance</small><b>${vt}</b><span>${vx}</span></div>
 <div class="duo">
 <div class="box"><h3>Visibilité en match</h3><p class="big">${String(vis()).replace(".",",")}<em>/5</em></p><p class="lvl ${vl.k}">${vl.n}</p>${dots()}<p class="q sm">${esc(Q())} : ${vl.g}${i.note?` · noté ${i.note}/10 dans la segmentation`:""}.</p></div>
 <div class="box"><h3>Habitudes</h3><p class="big">${habScore()}<em>/${habMax}</em></p><p class="lvl ${hl.k}">${hl.n}</p><div class="hl">${HAB.map(h=>{const v=+S.hab[h[0]]||0;return `<div class="hr ${v<=1?"low":""}"><span>${h[1]}</span><div class="tk"><i style="width:${v/3*100}%"></i></div><em>${FREQ.find(f=>f[0]===v)[1]}</em></div>`;}).join("")}</div></div>
 </div>
 ${sansCount()?`<div class="box"><h3>Ce qui change les jours sans</h3><p style="margin:6px 0 0">${cs.length?cs.map(c=>`<span class="tag">${esc(c)}</span>`).join(""):'<span class="q">Non renseigné</span>'}</p></div>`:""}
 <div class="box"><h3>Engagement</h3>
 ${S.plan.garder?`<p class="pl"><b>Je garde :</b> ${esc(S.plan.garder)}</p>`:""}
 ${S.plan.installer?`<p class="pl"><b>J'installe :</b> ${esc(S.plan.installer)}</p>`:""}
 ${S.plan.cible?`<p class="pl"><b>Objectif :</b> ma qualité visible dans ${S.plan.cible} matchs sur les 5 prochains.</p>`:""}
 ${S.plan.prochain?`<p class="pl"><b>Prochain bilan :</b> ${fd(S.plan.prochain)}</p>`:""}</div>
 <div class="box printonly${S.comment?"":" hide"}" id="pc"><h3>Commentaire du préparateur mental</h3><p class="pl" id="pct">${esc(S.comment)}</p></div>
 <div class="box noprint">${area("comment","Commentaire du préparateur mental",S.comment,"Ce que tu retiens de l'échange")}</div>
 <p class="q sm">Visibilité : un match « Oui » compte 1, « En partie » 0,5. Constant à partir de 4/5, irrégulier de 2,5 à 3,5, ponctuel en dessous. Habitudes : solides à partir de 75 %, fragiles à partir de 50 %.</p>
 <div class="acts noprint"><button class="btn" data-a="pdf">Imprimer / PDF</button><button class="btn sec" data-a="mail">Envoyer par email</button><button class="btn sec" data-a="html">Exporter HTML</button><button class="btn sec" data-a="back">Modifier les réponses</button>${EMBED?"":`<button class="btn sec" data-a="reset">Nouvelle fiche</button>`}</div>`;}
const VIEWS=[s0,s1,s2,s3,s4,s5];
function render(top){const st=S.step;document.querySelector("header").style.display=(st===0||st===5)?"":"none";document.getElementById("prog").innerHTML=`<div class="t"><span>${LABELS[st]}</span><span>Étape ${st+1} sur ${LABELS.length}</span></div><div class="b"><i style="width:${(st+1)/LABELS.length*100}%"></i></div>`;document.getElementById("app").innerHTML=VIEWS[st]();if(top)window.scrollTo(0,0);}
function check(){const st=S.step;
 if(st===0){if(!S.id.nom.trim())return"Indique le nom et prénom.";if(!S.id.qualite.trim())return"Indique la qualité haute travaillée.";}
 if(st===1){const m=S.matchs.filter(x=>!x.v).length;if(m)return `Il reste ${m} match${m>1?"s":""} à renseigner.`;}
 if(st===2){const m=HAB.filter(h=>S.hab[h[0]]===undefined||S.hab[h[0]]==="").length;if(m)return `Il reste ${m} habitude${m>1?"s":""} à renseigner.`;}
 return"";}
function setp(p,v){const a=p.split(".");let o=S;for(let i=0;i<a.length-1;i++){o[a[i]]=o[a[i]]||{};o=o[a[i]];}o[a[a.length-1]]=v;}
function summary(){const i=S.id,[vt,vx]=verdict(),t=["MON NIVEAU DE CONSTANCE — Y.E.S.I CONCEPT","",`Joueur : ${i.nom}`,`Poste : ${i.poste}`,`Catégorie : ${i.categorie}`,`Club : ${i.club}`,`Date : ${i.date}`,`Qualité haute travaillée : ${i.qualite}`,"",`Niveau de constance : ${vt}`,vx,"",`Visibilité en match : ${vis()}/5 (${visLevel().n})`];
 S.matchs.forEach((m,k)=>t.push(`  Match ${k+1}${m.adv?" ("+m.adv+")":""} : ${{oui:"oui",partiel:"en partie",non:"non"}[m.v]||"-"}`));
 t.push("",`Habitudes : ${habScore()}/${habMax} (${habLevel().n})`);HAB.forEach(h=>t.push(`  ${h[1]} : ${(FREQ.find(f=>f[0]===+S.hab[h[0]])||[0,"-"])[1]}`));
 const cs=CAUSES.filter(c=>S.causes[c[0]]).map(c=>c[1]);if(S.autre.trim())cs.push(S.autre.trim());if(cs.length)t.push("",`Ce qui change les jours sans : ${cs.join(", ")}`);
 t.push("");if(S.plan.garder)t.push(`Je garde : ${S.plan.garder}`);if(S.plan.installer)t.push(`J'installe : ${S.plan.installer}`);if(S.plan.cible)t.push(`Objectif : qualité visible dans ${S.plan.cible} matchs sur les 5 prochains`);if(S.plan.prochain)t.push(`Prochain bilan : ${S.plan.prochain}`);if(S.comment)t.push("",`Commentaire du préparateur : ${S.comment}`);return t.join("\n");}
function exportHtml(){const open="/*DA"+"TA*/",end="/*E"+"ND*/";const copy=JSON.parse(JSON.stringify(S));copy.step=5;let h="<!doctype html>\n"+document.documentElement.outerHTML;const a=h.indexOf(open),b=h.indexOf(end);h=h.slice(0,a+open.length)+JSON.stringify(copy).replace(/</g,"\\u003c")+h.slice(b);const u=URL.createObjectURL(new Blob([h],{type:"text/html"})),l=document.createElement("a");l.href=u;l.download="constance-"+(S.id.nom||"joueur").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-")+".html";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);}
document.addEventListener("click",e=>{const m=e.target.closest("[data-m]");if(m){const k=m.dataset.m;S.causes[k]=!S.causes[k];m.setAttribute("aria-pressed",!!S.causes[k]);save();return;}
 const c=e.target.closest(".chip[data-p]");if(c){let v=c.dataset.v;if(/^\d+$/.test(v))v=+v;setp(c.dataset.p,v);c.parentNode.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===c));error="";const er=document.querySelector(".err");if(er)er.remove();save();return;}
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;
 if(a==="next"){error=check();if(error){render(false);document.querySelector(".err").scrollIntoView({block:"center"});return;}S.step++;error="";save();render(true);}
 if(a==="back"){S.step--;error="";save();render(true);}
 if(a==="pdf")window.print();
 if(a==="html")exportHtml();
 if(a==="mail")location.href="mailto:?subject="+encodeURIComponent("Niveau de constance — "+S.id.nom)+"&body="+encodeURIComponent(summary());
 if(a==="reset"){if(!b.dataset.c){b.dataset.c="1";b.textContent="Appuie encore pour tout effacer";return;}S=blank();save();render(true);}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.i){setp(t.dataset.i,t.value);save();if(t.dataset.i==="comment"){document.getElementById("pct").textContent=t.value;document.getElementById("pc").classList.toggle("hide",!t.value.trim());}}});
render(false);
</script>
